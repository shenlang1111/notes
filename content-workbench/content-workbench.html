<script>
(function() {
  // ========================================
  // State
  // ========================================
  var state = {
    contentType: 'knowledge',
    targetChapter: '',
    history: []
  };

  // Load history from localStorage
  try {
    var saved = localStorage.getItem('content-workbench-history');
    if (saved) {
      state.history = JSON.parse(saved);
    }
  } catch(e) {}

  // ========================================
  // DOM References
  // ========================================
  var ideaInput = document.getElementById('ideaInput');
  var refineBtn = document.getElementById('refineBtn');
  var clearBtn = document.getElementById('clearBtn');
  var typeChips = document.getElementById('typeChips');
  var chapterSelect = document.getElementById('chapterSelect');
  var templateChips = document.getElementById('templateChips');
  var previewPlaceholder = document.getElementById('previewPlaceholder');
  var previewContent = document.getElementById('previewContent');
  var previewType = document.getElementById('previewType');
  var previewChapter = document.getElementById('previewChapter');
  var previewBox = document.getElementById('previewBox');
  var copyBtn = document.getElementById('copyBtn');
  var editBtn = document.getElementById('editBtn');
  var historyList = document.getElementById('historyList');
  var clearHistoryBtn = document.getElementById('clearHistoryBtn');
  var updateCount = document.getElementById('updateCount');
  var toast = document.getElementById('toast');

  // ========================================
  // Content Type Chips
  // ========================================
  typeChips.addEventListener('click', function(e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    typeChips.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('active'); });
    chip.classList.add('active');
    state.contentType = chip.dataset.type;
  });

  // ========================================
  // Template Chips
  // ========================================
  templateChips.addEventListener('click', function(e) {
    var chip = e.target.closest('.template-chip');
    if (!chip) return;
    var template = chip.dataset.template;
    ideaInput.value = template;
    ideaInput.focus();
    checkInput();
  });

  // ========================================
  // Chapter Select
  // ========================================
  chapterSelect.addEventListener('change', function() {
    state.targetChapter = chapterSelect.value;
  });

  // ========================================
  // Input Validation
  // ========================================
  function checkInput() {
    refineBtn.disabled = ideaInput.value.trim().length < 5;
  }

  ideaInput.addEventListener('input', checkInput);

  // ========================================
  // Clear
  // ========================================
  clearBtn.addEventListener('click', function() {
    ideaInput.value = '';
    previewContent.classList.remove('visible');
    previewPlaceholder.style.display = '';
    previewBox.contentEditable = 'false';
    previewBox.style.background = '';
    previewBox.style.borderColor = '';
    editBtn.textContent = '✏️ 编辑';
    refineBtn.disabled = true;
    chapterSelect.value = '';
    state.targetChapter = '';
    typeChips.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('active'); });
    typeChips.querySelector('[data-type="knowledge"]').classList.add('active');
    state.contentType = 'knowledge';
  });

  // ========================================
  // Refine & Preview
  // ========================================
  refineBtn.addEventListener('click', function() {
    var rawText = ideaInput.value.trim();
    if (!rawText) return;

    var typeLabel = getTypeLabel(state.contentType);
    var chapterLabel = getChapterLabel(state.targetChapter, rawText);
    var refined = refineContent(rawText, state.contentType);

    // Show preview
    previewPlaceholder.style.display = 'none';
    previewContent.classList.add('visible');
    previewType.textContent = typeLabel;
    previewChapter.textContent = chapterLabel;
    previewBox.textContent = refined;
    previewBox.contentEditable = 'false';
    previewBox.style.background = '';
    previewBox.style.borderColor = '';
    editBtn.textContent = '✏️ 编辑';

    // Scroll to preview
    document.getElementById('previewPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  function getTypeLabel(type) {
    var map = {
      knowledge: '📚 知识补充',
      correction: '🔧 内容修正',
      product: '📦 产品信息',
      sales: '💬 话术更新',
      other: '📝 其他'
    };
    return map[type] || '📝 其他';
  }

  function getChapterLabel(chapter, rawText) {
    if (chapter) {
      var sel = chapterSelect.querySelector('option[value="' + chapter + '"]');
      if (sel) return sel.textContent;
    }
    // Auto-detect
    var lower = rawText.toLowerCase();
    if (/阴离子|羧酸|磺酸|硫酸|氨基酸|甘氨|谷氨|甲基牛磺|aes|las|sles/i.test(lower)) return '第3章 · 阴离子表面活性剂';
    if (/阳离子|季铵|聚季铵|pq-|polyquta/i.test(lower)) return '第4章 · 阳离子表面活性剂';
    if (/两性|甜菜碱|咪唑啉|氧化胺|磺基甜菜|tc-shd|tc-mab|tc-cao|tc-lao|cab|capb/i.test(lower)) return '第5章 · 两性表面活性剂';
    if (/非离子|烷基糖苷|apg|脂肪醇|烷醇酰胺|aeo|tx-/i.test(lower)) return '第6章 · 非离子表面活性剂';
    if (/产品|代号|对照|inco|gck|cg30|amin/i.test(lower)) return '第11章 · 产品对照表';
    if (/销售|话术|客户|卖点|选天赐|供应链/i.test(lower)) return '附录 · 销售话术';
    return '待判断';
  }

  function refineContent(rawText, type) {
    // Structure the raw idea into a formatted update request
    var lines = [];
    lines.push('【更新请求】');
    lines.push('');

    switch(type) {
      case 'knowledge':
        lines.push('类型：知识补充');
        lines.push('原始想法：' + rawText);
        lines.push('');
        lines.push('--- 提炼后的内容 ---');
        lines.push('');
        lines.push('[请根据原始想法，补充以下格式的内容]');
        lines.push('');
        lines.push('## 知识点');
        lines.push('[用1-2句话概括核心知识点]');
        lines.push('');
        lines.push('## 详细说明');
        lines.push('[展开说明，包含机理、数据、结构式等]');
        lines.push('');
        lines.push('## 与天赐产品的关联');
        lines.push('[说明该知识点如何关联到天赐的具体产品]');
        break;

      case 'correction':
        lines.push('类型：内容修正');
        lines.push('原始想法：' + rawText);
        lines.push('');
        lines.push('--- 修正内容 ---');
        lines.push('');
        lines.push('【修正前】[待修正的原文内容]');
        lines.push('【修正后】[修正后的正确内容]');
        lines.push('【修正原因】[为什么需要修正]');
        break;

      case 'product':
        lines.push('类型：产品信息更新');
        lines.push('原始想法：' + rawText);
        lines.push('');
        lines.push('--- 产品信息 ---');
        lines.push('');
        lines.push('产品名称：[官方产品名]');
        lines.push('INCI名称：[INCI]');
        lines.push('所属类别：[化学类别]');
        lines.push('更新内容：[具体更新什么]');
        break;

      case 'sales':
        lines.push('类型：话术更新');
        lines.push('原始想法：' + rawText);
        lines.push('');
        lines.push('--- 话术内容 ---');
        lines.push('');
        lines.push('适用场景：[客户类型/销售阶段]');
        lines.push('话术要点：');
        lines.push('1. [要点1]');
        lines.push('2. [要点2]');
        lines.push('3. [要点3]');
        break;

      default:
        lines.push('类型：其他');
        lines.push('原始想法：' + rawText);
        lines.push('');
        lines.push('--- 内容 ---');
        lines.push(rawText);
    }

    lines.push('');
    lines.push('---');
    lines.push('目标章节：' + getChapterLabel(state.targetChapter, rawText));
    lines.push('生成时间：' + new Date().toLocaleString('zh-CN'));

    return lines.join('\n');
  }

  // ========================================
  // Edit Toggle
  // ========================================
  editBtn.addEventListener('click', function() {
    var isEditing = previewBox.contentEditable === 'true';
    if (isEditing) {
      // Save
      previewBox.contentEditable = 'false';
      previewBox.style.background = '';
      previewBox.style.borderColor = '';
      editBtn.textContent = '✏️ 编辑';
      showToast('内容已保存');
    } else {
      // Edit
      previewBox.contentEditable = 'true';
      previewBox.style.background = '#fffbeb';
      previewBox.style.borderColor = 'var(--warn)';
      editBtn.textContent = '✅ 完成编辑';
      previewBox.focus();
    }
  });

  // ========================================
  // Copy
  // ========================================
  copyBtn.addEventListener('click', function() {
    var text = previewBox.textContent;
    if (!text.trim()) return;

    // Copy to clipboard
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function() {
        addToHistory(text);
        showToast('✅ 更新请求已复制到剪贴板！粘贴给我即可执行');
      }).catch(function() {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      addToHistory(text);
      showToast('✅ 更新请求已复制到剪贴板！粘贴给我即可执行');
    } catch(e) {
      showToast('复制失败，请手动选中预览内容复制');
    }
    document.body.removeChild(ta);
  }

  // ========================================
  // History
  // ========================================
  function addToHistory(content) {
    var firstLine = content.split('\n')[0] || '更新';
    var typeLabel = getTypeLabel(state.contentType);
    var chapterLabel = getChapterLabel(state.targetChapter, content);

    var entry = {
      title: content.split('\n').filter(function(l) { return l.startsWith('原始想法：'); })[0]?.replace('原始想法：', '') || firstLine.replace('【', '').replace('】', ''),
      type: state.contentType,
      typeLabel: typeLabel,
      chapter: chapterLabel,
      time: new Date().toLocaleString('zh-CN'),
      content: content
    };

    state.history.unshift(entry);
    if (state.history.length > 50) state.history.pop();

    try {
      localStorage.setItem('content-workbench-history', JSON.stringify(state.history));
    } catch(e) {}

    renderHistory();
    updateCount.textContent = '已更新 ' + state.history.length + ' 次';
  }

  function renderHistory() {
    if (state.history.length === 0) {
      historyList.innerHTML = '<li class="history-empty">还没有更新记录，开始使用吧</li>';
      return;
    }

    historyList.innerHTML = state.history.map(function(item, i) {
      var dotClass = item.type === 'correction' ? 'fix' : (item.type === 'knowledge' ? 'add' : 'info');
      return '<li class="history-item">' +
        '<span class="history-dot ' + dotClass + '"></span>' +
        '<div class="history-body">' +
          '<div class="history-title">' + escapeHtml(item.title.substring(0, 60)) + (item.title.length > 60 ? '...' : '') + '</div>' +
          '<div class="history-meta">' +
            '<span>' + item.typeLabel + '</span>' +
            '<span>' + item.chapter + '</span>' +
            '<span>' + item.time + '</span>' +
          '</div>' +
        '</div>' +
      '</li>';
    }).join('');
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  clearHistoryBtn.addEventListener('click', function() {
    if (confirm('确定要清空所有更新历史吗？')) {
      state.history = [];
      try {
        localStorage.removeItem('content-workbench-history');
      } catch(e) {}
      renderHistory();
      updateCount.textContent = '已更新 0 次';
      showToast('历史记录已清空');
    }
  });

  // ========================================
  // Toast
  // ========================================
  var toastTimer;

  function showToast(msg) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = setTimeout(function() {
      toast.classList.remove('show');
    }, 2500);
  }

  // ========================================
  // Init
  // ========================================
  renderHistory();
  updateCount.textContent = state.history.length > 0 ? '已更新 ' + state.history.length + ' 次' : '已更新 0 次';

  // Keyboard shortcut: Ctrl+Enter to refine
  ideaInput.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      if (!refineBtn.disabled) {
        refineBtn.click();
      }
    }
  });

})();
</script>
